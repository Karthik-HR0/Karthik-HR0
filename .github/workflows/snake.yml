name: generate animation

on:
  schedule:
    - cron: "0 */24 * * *"

  workflow_dispatch:

  push:
    branches:
      - master

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Generate lavender contribution snake
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: Karthik-hr0
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=%239B8AAE
            dist/github-contribution-grid-snake-dark.svg?color_snake=%239B8AAE

      - name: Push SVG to output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
